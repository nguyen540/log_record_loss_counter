[project]
name = "log-record-loss-counter"
version = "0.1.1"
description = "Counts dropped log records from handler errors and flushes the total as a periodic summary"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
